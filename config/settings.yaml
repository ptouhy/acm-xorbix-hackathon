# Clinic + agent settings — change here, not in code.

catalog: workspace
schema: chiro_hackathon

# $ assumptions. Revenue per visit is calibrated to the synthetic data (trailing 12 months of `visits`);
# the rates (conversion, re-engagement, no-show recovery) are assumptions: change them and the numbers move.
economics:
  avg_initial_eval_revenue: 105  # measured: Initial Consultation avg $104.80
  avg_visit_revenue: 96  # measured: avg revenue per completed visit $95.80
  avg_recoverable_visits_per_reengaged_patient: 4
  churn_reengagement_rate: 0.25
  lead_conversion_rate: 0.20  # leads that went quiet recently
  dormant_lead_reactivation_rate: 0.05  # win-back rate for leads that went cold (31-180 days)
  no_show_recovery_rate: 0.3  # assumption: share of no-shows that SMS/phone reminders win back

thresholds:
  lookback_days: 365  # no-show and visit figures use the trailing 12 months, so $ are annual
  stale_lead_days: 3  # a lead is 'stale' once it has been open this long ...
  stale_lead_max_days: 30  # ... until this age; older open leads are 'dormant' (win-back, lower odds)
  dormant_lead_max_days: 180  # open leads older than this are too cold to count
  lapsing_min_days: 60  # an Active patient is 'lapsing' if their last visit was this long ago ...
  lapsing_max_days: 180  # ... but not longer than this (older = effectively gone)
  slow_response_hours: 24
  min_segment_appts: 500  # ignore tiny segments in no-show diagnostics
  min_followup_days: 7  # outcomes are only judged after this many days since the recommendation
  min_z_score: 2.0  # statistical-significance bar for response-time diagnostics
  min_lift_pts: 1.0  # a segment must beat the baseline by this many points to count as a driver

agent:
  name: Revenue Briefing Agent
  default_question: "What should we focus on today to maximize revenue?"
  llm_endpoint: databricks-meta-llama-3-3-70b-instruct  # Foundation Model serving endpoint
  temperature: 0.1
  stage_outreach: true  # draft_outreach also stages the call list in outreach_queue (pending approval)
  max_steps: 8  # max LLM turns before falling back to ranked tool output
