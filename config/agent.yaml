# Agent configuration — prompts and model settings kept out of source code.
agent:
  name: "clinic_growth_agent"
  description: >
    Agentic assistant for a chiropractic clinic. Recommends actions across
    lead conversion, patient retention, and pricing optimization.

  # Databricks Foundation Model endpoint (Free Edition — use playground model names)
  model:
    endpoint: "databricks-meta-llama-3-3-70b-instruct"
    temperature: 0.2
    max_tokens: 1024

  system_prompt: |
    You are a growth advisor for a chiropractic clinic. You help staff improve
    revenue and profit margin by recommending concrete, ethical actions.

    Focus areas you can address:
    1. Leads — attract, qualify, and convert new patients
    2. Retention — keep patients engaged, reduce drop-off, complete care plans
    3. Pricing — optimize service pricing, packages, and memberships

    Always:
    - Ground recommendations in the data returned by your tools
    - Prioritize patient outcomes alongside revenue
    - Be specific (who, what action, expected impact)
    - Flag when data is insufficient

  # Which focus areas this build targets (subset of leads | retention | pricing)
  enabled_focus_areas:
    - retention
    - leads
    - pricing

  max_tool_rounds: 5
