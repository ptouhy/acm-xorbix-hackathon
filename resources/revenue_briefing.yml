resources:
  jobs:
    setup_data:
      name: "[${bundle.target}] Setup synthetic clinic data"
      max_concurrent_runs: 1
      environments:
        - environment_key: Default
          spec:
            environment_version: "3"
      tasks:
        - task_key: generate_synthetic_data
          notebook_task:
            notebook_path: ../sample_data/generate_synthetic_data.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: Default

    evaluate_agent:
      name: "[${bundle.target}] Evaluate tool selection"
      max_concurrent_runs: 1
      timeout_seconds: 3600
      environments:
        - environment_key: Default
          spec:
            environment_version: "3"
      tasks:
        - task_key: eval_tool_selection
          notebook_task:
            notebook_path: ../src/notebooks/06_eval_tool_selection.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              llm_endpoint: ${var.llm_endpoint}
              runs: "5"
              experiment_path: ${resources.experiments.briefing_experiment.name}
          environment_key: Default

    revenue_briefing:
      name: "[${bundle.target}] Revenue Briefing Agent"
      max_concurrent_runs: 1
      environments:
        - environment_key: Default
          spec:
            environment_version: "3"
      tasks:
        - task_key: run_agentic_briefing
          notebook_task:
            notebook_path: ../src/notebooks/04_run_agentic.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              llm_endpoint: ${var.llm_endpoint}
              question: ${var.question}
              experiment_path: ${resources.experiments.briefing_experiment.name}
          environment_key: Default

        - task_key: measure_outcomes
          depends_on:
            - task_key: run_agentic_briefing
          notebook_task:
            notebook_path: ../src/notebooks/05_measure_outcomes.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: Default

  experiments:
    briefing_experiment:
      name: /Users/${workspace.current_user.userName}/revenue_briefing_agent
