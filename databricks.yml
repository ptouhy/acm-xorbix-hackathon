# Databricks Asset Bundle — Free Edition (serverless)
# Deploy: databricks bundle validate && databricks bundle deploy -t dev

bundle:
  name: acm-xorbix-hackathon

workspace:
  host: ${var.databricks_host}

variables:
  databricks_host:
    description: Free Edition workspace URL (e.g. https://dbc-xxx.cloud.databricks.com)
    default: https://dbc-1ee896cd-3f9f.cloud.databricks.com
  catalog:
    description: Unity Catalog name (run SHOW CATALOGS — often "workspace" on Free Edition)
    default: workspace
  schema:
    description: Schema created by generate_synthetic_data notebook
    default: chiro_hackathon

resources:
  jobs:
    clinic_agent_pipeline:
      name: "[${bundle.target}] Clinic Growth Agent"
      max_concurrent_runs: 1
      environments:
        - environment_key: Default
          spec:
            environment_version: "3"
      tasks:
        - task_key: run_agent
          notebook_task:
            notebook_path: ./notebooks/02_run_agent.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              question: "Which patients are at risk of dropping off and what revenue can we recover?"
              use_model: "false"
          environment_key: Default

  experiments:
    clinic_agent:
      name: /Shared/${bundle.name}/clinic_growth_agent
      tags:
        hackathon: xorbix-uiowa-2026

sync:
  include:
    - config/**
    - notebooks/**
    - src/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
