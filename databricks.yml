# Databricks Asset Bundle (Declarative Automation Bundle).
#
# No workspace URL lives in this file. The CLI takes the workspace from your profile:
#   databricks auth login --host https://<your-workspace>.cloud.databricks.com
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run revenue_briefing -t dev
#
# To target another workspace: log in to it (or pass --profile) — no code changes.

bundle:
  name: acm-xorbix-hackathon

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog holding the synthetic clinic tables
    default: workspace
  schema:
    description: Schema holding the synthetic clinic tables
    default: chiro_hackathon
  llm_endpoint:
    description: Model Serving endpoint that drives the agent (must support tool calling)
    default: databricks-meta-llama-3-3-70b-instruct
  question:
    description: Question the scheduled/run job asks the agent
    default: "What should we focus on today to maximize revenue?"

sync:
  include:
    - src/**
    - config/**
    - sample_data/**

targets:
  dev:
    mode: development
    default: true
